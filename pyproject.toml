[tool.poetry]
name = "syntetic-rock-joint-generation-for-ml"
version = "0.1.0"
description = "Generating syntetic rock joint dataset and evaluating the dataset's generalisability by training a machine learning model which is evaluated on real rock joint data"
authors = ["tfh <tom.frode.hansen@ngi.no>, jyc <jessica.ka.yi.chiu@ngi.no>"]
license = "MIT"
readme = "README.md"
packages = [{include = "ml_segmentation", from = "src"}]

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit" # only use this source when it is explicitly requested

[tool.poetry.dependencies]
python = "^3.11"
ipykernel = "^6.29.5"
torch = {version = "^2.3.1+cu121", source = "pytorch"}
numpy = "^2.1.3"
rich = "^13.9.4"
tensorboard = "^2.18.0"
pre-commit = "^4.0.1"
pydantic = "^2.10.2"
omegaconf = "^2.3.0"
hydra-core = "^1.3.2"
torch-tb-profiler = "^0.4.3"
pandas = "^2.2.3"
matplotlib = "^3.9.2"
segmentation-models-pytorch = "^0.3.4"
mlflow = "^2.18.0"
optuna = "^4.1.0"


[tool.poetry.group.dev.dependencies]
ipdb = "^0.13.13"
pandas-stubs = "^2.2.3.241126"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
force_single_line = false
lines_after_imports = 2

[tool.ruff]
line-length = 88

[tool.ipdb]
context = 10
