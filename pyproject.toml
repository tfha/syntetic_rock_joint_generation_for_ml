[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "syntetic-rock-joint-generation-for-ml"
version = "0.1.0"
description = "Generating syntetic rock joint dataset and ML evaluation"
authors = [
  { name = "TFH", email = "tom.frode.hansen@ngi.no" },
  { name = "KYC", email = "jessica.ka.yi.chiu@ngi.no" }
]
license = "MIT"
readme = "README.md"
packages = [
  { include = "ml_segmentation", from = "src" }
]
dependencies = [
  "numpy>=1.23,<1.24",
  "scipy>=1.10.1",
  # ...other deps...
  # Remove the torch line below (torch is provided by the curated image / installed in Dockerfile)
  # "torch (>=2.3.1+cu121,<3.0.0)",   # <-- REMOVE this entry
]
requires-python = ">=3.10,<4.0"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit" # only use this source when it is explicitly requested

[tool.poetry]
name = "syntetic-rock-joint-generation-for-ml"
version = "0.1.0"
description = "Generating syntetic rock joint dataset and ML evaluation"
authors = [
  "TFH <tom.frode.hansen@ngi.no>",
  "KYC <jessica.ka.yi.chiu@ngi.no>"
]

# ensure Poetry finds the src package
packages = [
  { include = "ml_segmentation", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
# keep runtime deps minimal; list the ones you need here
rich = "^13.4.2"
marshmallow = "3.26.1"
ipykernel = "^6.29.5"
numpy = "^2.1.3"
pre-commit = "^4.0.1"
pydantic = "^2.10.2"
omegaconf = "^2.3.0"
hydra-core = "^1.3.2"
torch-tb-profiler = "^0.4.3"
pandas = "^2.2.3"
matplotlib = "^3.9.2"
segmentation-models-pytorch = "^0.3.4"
mlflow = "^2.18.0"
optuna = "^4.1.0"
torchmetrics = "^1.6.0"
torchinfo = "^1.8.0"
pillow = "^11.0.0"
opencv-python = "^4.10.0"
azure-ai-ml = "^1.26.0"
azure-identity = "^1.21.0"
python-dotenv = "^1.1.0"
toml = "^0.10.2"
absl-py = "1.4.0"
sympy = "^1.14.0"
azure-storage-blob = "^12.27.1"

[tool.poetry.group.dev.dependencies]
tensorboard = "^2.18.0"
pytest = "^8.3.5"
pytest-cov = "^6.0.0"
ipdb = "^0.13.13"
pandas-stubs = "^2.2.3.241126"
ruff = "^0.12.1"
isort = "^6.0.1"
mypy = "^1.17.1"
types-toml = "^0.10.8.20240310"
types-pyyaml = "^6.0.12.20250809"


[tool.isort]
profile = "black"
force_single_line = false

[tool.ruff]
line-length = 88

# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".github",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]


[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Enable rules from pycodestyle (E), pyflakes (F), isort (I)
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings (optional: remove if too noisy)
    "F",   # pyflakes
    # "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # function calls in argument defaults (review before ignoring globally)
    "C901",  # complexity (consider per-file/per-function instead)
]

[tool.ruff.lint.isort]
known-first-party = ["ml_segmentation"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]

[tool.ruff.format]
# Clamp to Black-like choices:
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Respect magic trailing comma
skip-magic-trailing-comma = false
# Use line feeds for line endings
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ipdb]
context = 10

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["src", "tests", "scripts"]

[tool.coverage.report]
show_missing = true
fail_under = 10 # 10% coverage

[tool.poetry.extras]
# valid key name (only letters, digits, hyphen, underscore, dot)
scripts = ["hydra-core"]
