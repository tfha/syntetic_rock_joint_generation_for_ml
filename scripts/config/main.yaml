defaults: #points to sub-configs
  - model: unet
  - _self_ # main overrides sub-cfg in case of duplicates


# EXPERIMENT CONFIG
#####################################################################

path_project: C:\Users\TFH\NGI\Jessica Ka Yi Chiu - Paper - Synthetic rock joint generation for ML
matplotlib_config_path: ./scripts/config/figures_styles.mplstyle

# NOTE: hydra configs are not passed on to cfg and don't need schema
hydra:
  run:
    dir: ${path_project}/experiments/hydra_outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${path_project}/experiments/hydra_outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

experiment:
  experiment_strategy: "standard_run"  # Options: "standard_run", "study_verification", "dataset_size_test", "semi_supervised_learning", "one_shot_segmentation"
  dataset_strategies:
    standard_run:
      train_datasets:
        - "synthetic_rock_slope"
        - "synthetic_fracman"
      test_datasets:
        - "synthetic_rock_slope"
        - "synthetic_fracman"
    study_verification:
      train_datasets:
        - "synthetic_rock_slope"
        - "synthetic_fracman"
      test_datasets:
        - "real_world_box"
    dataset_size_test:
      train_datasets:
        - "synthetic_box"
      test_datasets:
        - "real_world_box"
    semi_supervised_learning:
      train_datasets:
        - "synthetic_rock_slope"
        - "synthetic_fracman"
      test_datasets:
        - "real_world_box"
        - "real_world_rock_slope"
    one_shot_segmentation:
      train_datasets:
        - "synthetic_rock_slope"
        - "real_world_rock_slope"
      test_datasets: []
  seed: 42
  log_mlflow: false
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1
  early_stopping_patience: 10
  optional_transforms: false
  overfit_check: false
  crossvalidation: false

dataset:
  path_raw_rockmass: ${path_project}/Data/Rockmass
  path_raw_labels: ${path_project}/Data/Label
  prefixes:
    synthetic_rock_slope:
      - "Larvik"
      - "RV4"
    synthetic_fracman:
      - "FracMan"
    synthetic_box:
      - "Benchmark"
    real_world_box:
      - "Box"
    real_world_rock_slope:
      - "Canada"

tensorboard:
  path: ./experiments/tensorboard

mlflow:
  path: ${path_project}/experiments/mlruns
  experiment_name: null # is set when calling scripts
  save_model: false

optuna:
  n_trials: 5
  path_results: experiments/hyperparameters
