defaults: #points to sub-configs
  - model: unet
  - _self_ # main overrides sub-cfg in case of duplicates


# EXPERIMENT CONFIG
#####################################################################

path_project: C:\Users\KYC\OneDrive - NGI\Documents\PhD\Paper - Synthetic rock joint generation for ML
matplotlib_config_path: ./scripts/config/figures_styles.mplstyle

# NOTE: hydra configs are not passed on to cfg and don't need schema
hydra:
  run:
    dir: ${path_project}/experiments/hydra_outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${path_project}/experiments/hydra_outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

# Azure ML specific configuration
azure_ml:
  compute_name: "Standard-NC6s-v3"  # GPU VM size for training: NC64as-T4-v3; Standard-NC6s-v3
  experiment_name: "rock-segmentation" # Default experiment name
  environment_name: "rock-segmentation-env-curated-py310"  # Name of the Azure ML environment
  environment_version: "2"  # Default environment version
  use_new_version: true  # Whether to create and use a new version of the environment
  use_curated_env: false  # Whether to use a curated AzureML environment instead of custom one
  curated_env_name: "azureml://registries/azureml/environments/acpt-pytorch-2.2-cuda12.1/labels/latest"  # The name of the curated environment to use if use_curated_env is true
  base_docker_image: "mcr.microsoft.com/azureml/curated/acpt-pytorch-2.2-cuda12.1:37"
  # base_docker_image: "mcr.microsoft.com/azureml/openmpi5.0-cuda12.4-ubuntu22.04"  # Base docker image for custom environments with CUDA 12.4 support
# Alternatives:
# CUDA 12+ options:
#base_docker_image: "mcr.microsoft.com/azureml/openmpi5.0-cuda12.5-ubuntu22.04" # CUDA 12.5 with Ubuntu 22.04
#base_docker_image: "mcr.microsoft.com/azureml/openmpi5.0-cuda12.6-ubuntu24.04" # CUDA 12.6 with Ubuntu 24.04
# CUDA 11+ options:
#base_docker_image: "mcr.microsoft.com/azureml/minimal-ubuntu22.04-py39-cuda11.8-gpu-inference:latest" # CUDA 11.8 for inference
#base_docker_image: "mcr.microsoft.com/azureml/openmpi4.1.0-cuda11.8-cudnn8-ubuntu22.04" # CUDA 11.8 with OpenMPI


# Azure Data Assets configuration
# Note: Credentials are loaded from .env file at runtime
azure_data_assets:
  # Command to execute - available options:
  # - register-base-datasets: Register base datasets in Azure ML
  # - register-splits: Register dataset splits in Azure ML
  # - list-assets: List data assets in Azure ML
  # - compare-assets: Compare two versions of a data asset
  # - build-environment: Build the Azure ML environment in Azure ML
  # - help: Show detailed help and best practices
  command: register-base-datasets  # Default command to register base datasets
  # Parameters for asset commands
  asset_name: null  # Name of the asset to list or compare
  version1: null    # First version for comparison
  version2: null    # Second version for comparison
  # Output directory for logs
  output_dir: outputs/azure_data_assets/${now:%Y-%m-%d_%H-%M-%S}

experiment:
  seed: 42
  log_mlflow: true
  compare_metric: dice_joints  # Metric for best model selection & early stopping (ALL experiments)
  # Monitor dice_joints to balance finding unlabeled joints (recall) with limiting noise (precision)
  # Dice = 2*TP/(2*TP+FP+FN) encourages high recall while penalizing excessive false positives
  # Options: 'loss' (min - conservative), 'dice_joints' (max - balanced), 'recall_joints' (max - aggressive)
  # Loss function configuration (using standard segmentation_models_pytorch library)
  loss_function: dice # Options: dice (V-Net 2016), focal (Lin et al. 2017)
  focal_gamma: 2.0  # Focal loss focusing parameter (default from paper: 2.0)
  # IMPORTANT: After label inversion (1-label), mask=1 is joints (minority), mask=0 is background
  # use alpha=0.75 to give MORE weight to the minority class (joints)
  focal_alpha: 0.75 # Focal loss class balancing (0.75 = more weight on minority class)
  # Prediction threshold for binary classification
  # For severe class imbalance, lower threshold makes model more sensitive to joints
  # Default 0.5 is neutral; 0.2-0.3 favors minority class (joints)
  # With incomplete labels, lower threshold encourages finding more joints (more FP acceptable)
  prediction_threshold: 0.2  # Lower threshold = more likely to predict joints (aggressive)
  # Finetuning strategy (Wachter et al. 2026)
  # None: standard training (verification/main experiments)
  # 'SM' (simple mixed): train on synth+real simultaneously
  # 'FT' (fine-tuned): pretrain on synth, then finetune on real
  training_strategy: null  # Options: null, SM, FT
  # Note: use_custom_splits and custom_splits_dir are set per-experiment in dataset_strategies
  num_workers: 2 # number of workers for data loading (reduced from 4 to avoid shared memory issues in Azure ML)
  # Dataset split configuration - use EITHER fractions OR counts, not both
  # Option 1: Fraction-based splits (default)
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1
  # Option 2: Count-based splits (comment out fractions above and uncomment below)
  # train_count: 100  # exact number of training images
  # val_count: 20     # exact number of validation images
  # test_count: 30    # exact number of test images
  # Option 3: Per-strategy split configuration (overrides global settings for specific strategies)
  # strategy_splits:
    # main_objective_dfn_rock_slope:
    #   train_fraction: 1.0  # Use ALL synthetic data for training
    #   val_fraction: 0.0     # No validation (test is different distribution)
    #   test_fraction: 1.0    # Use ALL real-world data for testing
    # main_objective_dfn_box:
    #   train_fraction: 1.0  # Use ALL synthetic data for training
    #   val_fraction: 0.0     # No validation (test is different distribution)
    #   test_fraction: 1.0    # Use ALL real-world data for testing
    # main_objective_box_rock_slope:
    #   train_fraction: 1.0  # Use ALL synthetic data for training
    #   val_fraction: 0.0     # No validation (test is different distribution)
    #   test_fraction: 1.0    # Use ALL real-world data for testing
    # main_objective_box_box:
    #   train_fraction: 1.0  # Use ALL synthetic data for training
    #   val_fraction: 0.0     # No validation (test is different distribution)
    #   test_fraction: 1.0    # Use ALL real-world data for testing
  # Early stopping configuration
  early_stopping_patience: 10  # SimpleMixed and FT Stage 2 patience
  early_stopping_delta: 0.0  # No minimum improvement threshold
  finetune_pretrain_patience: 10  # Early stopping patience for FT Stage 1 (pretrain on synthetic)
  optional_transforms:
    random_crop: true
    horizontal_flip: true
    vertical_flip: true
    color_jitter: true
    rotation: true
    gaussian_blur: true
    random_affine: true  # Scale, translate, shear (different camera positions/distances)
    random_perspective: true  # Perspective distortion (different viewing angles)
    random_erasing: true  # Occlusion simulation (vegetation, shadows, equipment)
  overfit_check: false
  sanity_check_num_batches: null # set to a low number to speed up training in order to check if functionality is working, e.g. 1-3
  quality_control_data: false
  crossvalidation: false
  path_example_images: ${path_project}/experiments/example_images
  download_outputs: false  # Flag to control whether to download outputs after job completion in Azure ML
  smoke_test: false        # If true, submit a lightweight smoke test job instead of full training
  smoke_test_use_cuda: false  # If true, the smoke test will try CUDA; otherwise forces CPU
  smoke_test_minimal: false   # If true with smoke_test, run a tiny env probe (nvidia-smi + torch import)
  experiment_strategy: "verification_box" # "verification_box", "verification_dfn", "main_objective_dfn_rock_slope", "main_objective_dfn_box", "main_objective_box_rock_slope", "main_objective_box_box", "dataset_size_test", "semi_supervised_learning", "one_shot_segmentation"
  dataset_strategies:
    verification_box:
      train_datasets:
        - "synthetic_box"
      test_datasets:
        - "synthetic_box"
    verification_dfn:
      train_datasets:
        - "synthetic_dfn"
      test_datasets:
        - "synthetic_dfn"
    verification_real_box:
      train_datasets:
        - "real_world_box"
      test_datasets:
        - "real_world_box"
    verification_real_rock_slope:
      train_datasets:
        - "real_world_rock_slope"
      test_datasets:
        - "real_world_rock_slope"
    main_objective_dfn_rock_slope:
      train_datasets:
        - "synthetic_dfn"
      test_datasets:
        - "real_world_rock_slope"
    main_objective_dfn_box:
      train_datasets:
        - "synthetic_dfn"
      test_datasets:
        - "real_world_box"
    main_objective_box_rock_slope:
      train_datasets:
        - "synthetic_box"
      test_datasets:
        - "real_world_rock_slope"
    main_objective_box_box:
      train_datasets:
        - "synthetic_box"
      test_datasets:
        - "real_world_box"
    dataset_size_test:
      train_datasets:
        - "synthetic_dfn"
      test_datasets:
        - "real_world_rock_slope"
    semi_supervised_learning:
      train_datasets:
        - "real_world_rock_slope"
      test_datasets:
        - "real_world_rock_slope"
    one_shot_segmentation:
      train_datasets:
        - "real_world_rock_slope"
      test_datasets: []
    # Wachter et al. (2026) Simple Mixed (SM) Experiments - BOX
