name: unetplusplus
num_epochs: 100  # Increased from 50 to give more time for joint learning
batch_size: 8  # Matching UNet and DeepLabV3+ batch size (reduced from 64 due to memory constraints)
learning_rate: 0.001
scheduler:
  mode: max      # Correct mode for dice_joints (should increase)
  patience: 5    # Increased from 3 to allow more exploration before LR reduction
  gamma: 0.5     # Reduce LR by 2x instead of 10x (was 0.1)
params:
  encoder_name: 'resnet34'
  encoder_depth: 5
  encoder_weights: 'imagenet'
  decoder_use_batchnorm: true
  decoder_channels:
    - 256
    - 128
    - 64
    - 32
    - 16
  decoder_attention_type: null
  in_channels: 3
  classes: 1
  activation: null
  aux_params: null
